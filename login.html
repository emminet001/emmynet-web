<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="loginmedia.css">
</head>
<body>
<section>
    <div class="left-login-container">

    </div>
    <div class="right-login-container">
        <div class="login-container">
           <div class="login-heading">
               <div class="logo">
                 <img src="./images/logo.png" alt="Emmynet ICT Hub logo">
               </div>
                   <h2>Emmynet <br><span>ICT Hub</span></h2>
                </div>
                <form class="login">
                    <h3>Welcome Back</h3>
                    <p>Login to access your dashboard,<br> project or training materials</p>
                    <div class="input-field">
                    <div class="email-box">
                        <label for="email">E-mail <span>*</span></label>
                        <input type="email" autocomplete="username" id="email" name="email" placeholder="Enter your email" required>
                    </div>
                    <div class="password-box">
                        <label for="password">Password <span>*</span></label>
                        <input type="password" name="password" autocomplete="current-password" id="password" placeholder="*********" required>
                        <i class="bi bi-eye-slash" id="togglePassword"></i>
                    </div>

                    <span class="sign-up" id="sign-up">Forgot your password?<a href="reset.html">Reset Here</a></span>

                    <button type="submit" class="login-button" id="login-button">Login</button>

                    <span class="sign-up">Don't have an account? <a href="signup.html">Sign Up</a></span>
                    
                    <div class="divider"><span>Or</span></div>
                    
                    <button type="button" class="google-btn" id="google-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        <span>Continue with Google</span></button>
                    </div>
                </form>
        </div>
    </div>
</section>
<script src="login.js"></script>
</body>
</html>

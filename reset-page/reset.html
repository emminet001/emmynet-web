<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmynet ICT Hub</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="resetmedia.css">
</head>
<body>
<section>
    <div class="left-login-container">

    </div>
    <div class="central-reset-container">
        <div class="reset-container">
           <div class="reset-heading">
               <div class="logo">
                    <img src="./images/logo.png" alt="">
                </div>
                   <h2>Emmynet <br><span>ICT Hub</span></h2>
            </div>
            <div class="reset-field">
                <div class="reset-img-container">
                    <div class="reset-img">
                        <img src="./images/achieve2.svg" alt="">
                    </div>
                </div>

                <h3>Reset Your Password</h3>
                <p>Enter your email address, and <br>we'll send you a link to reset<br> your password</p>

                <div class="input-field">
                    <div class="email-box">
                        <label for="email">E-mail <span>*</span></label>
                        <input title="Enter a functioning email" type="email" id="" placeholder="Enter your email">
                    </div>

                    <button type="submit" class="reset-button" id="login-button">Reset password</button>

                    <span class="reset">Remember your password? <a href="login.html">Back to Login</a></span> 
                </div>
            </div>
            <div class="footer-container">
                <div class="footer-image">
                    <img src="./images/reset image.jpg" alt="">
                </div>
            </div>
            <div class="footer-paragraph">
               <p>We take your security seriously.<br> Your information is safe and never shared.</p>
            </div>
        </div>
    </div>

    <div class="right-side-container">

</div>
</section>

<script src="login.js"></script>
</body>
</html>

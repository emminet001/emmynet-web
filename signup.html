<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emmynet ICT Hub</title>
    <link rel="icon" href="./emmynet website/images/logo.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="singup.css">
<link rel="stylesheet" href="signupquery.css">
</head>
<body>
<section>
    <div class="left-signup-container">

    </div>

    <form class="center-signup-container">
        <div class="signup-container">
            <div class="signup-heading">
                <div class="logo">
                    <img src="./images/logo.png" alt="">
                </div>
                   <h2>Emmynet <br><span>ICT Hub</span></h2>
                </div>
                <div class="sign-up">
                    <h3>Create Your Account</h3>
                    <p>Join Emmynet ICT Hub to track your project,<br> access training materials, or manage <br>your services. All in one.</p>

                    <div class="input-field">
                        <div class="email-box">
                            <label for="userName">Full Name<span>*</span></label>
                            <input type="text" name="fullname" id="userName" class="user-name" autocomplete="name" placeholder="Enter your full name" required>

                            <label for="emailField">E-mail <span>*</span></label>
                            <input title="Enter a functioning email" name="email" type="email" id="emailField" autocomplete="email" placeholder="Enter your email" required>
                        </div>

                        <div class="password-box">
                            <label for="password">password <span>*</span></label>
                            <input title="Enter a strong password" type="password" name="password" id="password" autocomplete="new-password" placeholder="*********" required>
                            <i class="bi bi-eye-slash" id="togglePassword"></i>
                        </div>
                    
                        <div class="gender-container">
                            <div class="gender-box">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="prefer-not">Prefer not to say</option>
                            </select>
                        </div>

                        <div class="country-box">
                            <label for="country">Country</label>
                            <select id="country" name="country" required>
                              <option value="" disabled selected>Select country</option>
                              <option value="Algeria">Algeria</option>
                              <option value="Angola">Angola</option>
                              <option value="Benin">Benin</option>
                              <option value="Botswana">Botswana</option>
                              <option value="Burkina Faso">Burkina Faso</option>
                              <option value="Burundi">Burundi</option>
                              <option value="Cabo Verde">Cabo Verde</option>
                              <option value="Cameroon">Cameroon</option>
                              <option value="Central African Republic">Central African Republic</option>
                              <option value="Chad">Chad</option>
                              <option value="Comoros">Comoros</option>
                              <option value="Congo (DRC)">Congo (Democratic Republic)</option>
                              <option value="Congo (Republic)">Congo (Republic)</option>
                              <option value="Côte d'Ivoire">Côte d'Ivoire</option>
                              <option value="Djibouti">Djibouti</option>
                              <option value="Egypt">Egypt</option>
                              <option value="Equatorial Guinea">Equatorial Guinea</option>
                              <option value="Eritrea">Eritrea</option>
                              <option value="Eswatini">Eswatini</option>
                              <option value="Ethiopia">Ethiopia</option>
                              <option value="Gabon">Gabon</option>
                              <option value="Gambia">Gambia</option>
                              <option value="Ghana">Ghana</option>
                              <option value="Guinea">Guinea</option>
                              <option value="Guinea-Bissau">Guinea-Bissau</option>
                              <option value="Kenya">Kenya</option>
                              <option value="Lesotho">Lesotho</option>
                              <option value="Liberia">Liberia</option>
                              <option value="Libya">Libya</option>
                              <option value="Madagascar">Madagascar</option>
                              <option value="Malawi">Malawi</option>
                              <option value="Mali">Mali</option>
                              <option value="Mauritania">Mauritania</option>
                              <option value="Mauritius">Mauritius</option>
                              <option value="Morocco">Morocco</option>
                              <option value="Mozambique">Mozambique</option>
                              <option value="Namibia">Namibia</option>
                              <option value="Niger">Niger</option>
                              <option value="Nigeria">Nigeria</option>
                              <option value="Rwanda">Rwanda</option>
                              <option value="São Tomé and Príncipe">São Tomé and Príncipe</option>
                              <option value="Senegal">Senegal</option>
                              <option value="Seychelles">Seychelles</option>
                              <option value="Sierra Leone">Sierra Leone</option>
                              <option value="Somalia">Somalia</option>
                              <option value="South Africa">South Africa</option>
                              <option value="South Sudan">South Sudan</option>
                              <option value="Sudan">Sudan</option>
                              <option value="Tanzania">Tanzania</option>
                              <option value="Togo">Togo</option>
                              <option value="Tunisia">Tunisia</option>
                              <option value="Uganda">Uganda</option>
                              <option value="Zambia">Zambia</option>
                              <option value="Zimbabwe">Zimbabwe</option>
                            </select>
                        </div>
                    </div>

                    <div class="state-box">
                        <label for="state">State</label>
                            <select id="state" name="state" required disabled>
                                <option value="" disabled selected>Select country first</option>
                            </select>
                    </div>

                    <button type="submit" class="signup-button" id="login-button">Create account</button>

                    <span class="have-account">Aleady have an account? <a href="login.html">Login</a></span>
                </div>
            </div>
            <div class="signup-condition">
                <p>By signing up, your agree to our.</p>
                <a href="#">Terms of Service</a><span> & </span><a href="#">Privacy policy</a>
            </div>
        </div>
    </form>
    <div class="right-signup-container">

    </div>
</section>
<script src="signup.js"></script>
</body>
</html>
